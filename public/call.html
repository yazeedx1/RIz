<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Call with Riz — AI Personal Assistant</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #111827;
      --accent: #10b981;
      --blue: #38bdf8;
      --danger: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #132338 0%, var(--bg) 70%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 28px 20px;
    }
    .top-bar {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--muted);
    }
    .top-bar a {
      color: var(--blue);
      text-decoration: none;
      font-weight: 600;
    }
    .caller-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 16px;
      max-width: 480px;
      width: 100%;
    }
    .avatar-ring {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: linear-gradient(135deg, #10b981, #0ea5e9);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 54px;
      font-weight: 800;
      color: #06131f;
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .avatar-ring.listening {
      animation: pulseGreen 1.5s infinite;
    }
    .avatar-ring.speaking {
      animation: pulseBlue 1.1s infinite;
    }
    @keyframes pulseGreen {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); transform: scale(1); }
      70% { box-shadow: 0 0 0 28px rgba(16, 185, 129, 0); transform: scale(1.04); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); transform: scale(1); }
    }
    @keyframes pulseBlue {
      0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.65); transform: scale(1); }
      70% { box-shadow: 0 0 0 32px rgba(56, 189, 248, 0); transform: scale(1.06); }
      100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); transform: scale(1); }
    }
    .caller-name {
      font-size: 28px;
      font-weight: 700;
    }
    .call-status {
      font-size: 15px;
      color: var(--accent);
      font-weight: 500;
    }
    .call-timer {
      font-family: monospace;
      font-size: 16px;
      color: var(--muted);
    }
    .transcript-box {
      width: 100%;
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 16px;
      min-height: 110px;
      max-height: 200px;
      overflow-y: auto;
      text-align: left;
      font-size: 14px;
      line-height: 1.5;
    }
    .transcript-box div + div {
      margin-top: 8px;
    }
    .you-line { color: #cbd5e1; }
    .riz-line { color: #6ee7b7; font-weight: 500; }
    .controls {
      display: flex;
      gap: 18px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      width: 100%;
      max-width: 480px;
    }
    .call-btn {
      border: none;
      border-radius: 999px;
      padding: 16px 26px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }
    .call-btn:active { transform: scale(0.97); }
    .btn-start { background: var(--accent); color: #051b11; }
    .btn-talk { background: #1e293b; color: var(--text); border: 1px solid rgba(255,255,255,0.15); }
    .btn-end { background: var(--danger); color: white; }
  </style>
</head>
<body>
  <div class="top-bar">
    <span>🔒 End-to-End Live AI Voice Call</span>
    <a href="/">← Back to Riz Dashboard</a>
  </div>

  <div class="caller-center">
    <div id="avatarRing" class="avatar-ring">R</div>
    <div class="caller-name">Riz AI Assistant</div>
    <div id="callStatus" class="call-status">Ready to connect voice call</div>
    <div id="callTimer" class="call-timer">00:00</div>

    <div id="transcriptBox" class="transcript-box">
      <div class="riz-line">🤖 <strong>Riz:</strong> Tap "Start Call" below and speak naturally—I'll listen automatically, pause when you finish speaking, and talk back to you!</div>
    </div>
  </div>

  <div class="controls">
    <button id="startCallBtn" class="call-btn btn-start">📞 Start Call</button>
    <button id="pushTurnBtn" class="call-btn btn-talk" style="display:none;">⚡ Send Turn Now</button>
    <button id="endCallBtn" class="call-btn btn-end" style="display:none;">📴 End Call</button>
  </div>

  <script>
    let callActive = false;
    let callSeconds = 0;
    let timerInterval = null;
    let mediaStream = null;
    let mediaRecorder = null;
    let audioContext = null;
    let vadInterval = null;
    let currentAudio = null;
    let isProcessingTurn = false;

    const avatarRing = document.getElementById('avatarRing');
    const callStatus = document.getElementById('callStatus');
    const callTimer = document.getElementById('callTimer');
    const transcriptBox = document.getElementById('transcriptBox');
    const startCallBtn = document.getElementById('startCallBtn');
    const pushTurnBtn = document.getElementById('pushTurnBtn');
    const endCallBtn = document.getElementById('endCallBtn');

    function addTranscript(role, text) {
      const div = document.createElement('div');
      div.className = role === 'riz' ? 'riz-line' : 'you-line';
      div.innerHTML = role === 'riz'
        ? `🤖 <strong>Riz:</strong> ${text}`
        : `🎙️ <strong>You:</strong> ${text}`;
      transcriptBox.appendChild(div);
      transcriptBox.scrollTop = transcriptBox.scrollHeight;
    }

    function formatTime(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    async function playBase64Audio(base64, fallbackText) {
      avatarRing.className = 'avatar-ring speaking';
      callStatus.textContent = '🔊 Riz is speaking...';
      return new Promise((resolve) => {
        if (!base64) {
          resolve();
          return;
        }
        const audio = new Audio(`data:audio/mp3;base64,${base64}`);
        currentAudio = audio;
        audio.onended = () => {
          currentAudio = null;
          resolve();
        };
        audio.onerror = () => {
          currentAudio = null;
          resolve();
        };
        audio.play().catch(() => resolve());
      });
    }

    async function listenOneUtterance() {
      if (!callActive || isProcessingTurn) return;

      try {
        if (!mediaStream) {
          mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        }
      } catch (err) {
        callStatus.textContent = '⚠️ Microphone permission needed: ' + err.message;
        return;
      }

      avatarRing.className = 'avatar-ring listening';
      callStatus.textContent = '🟢 Listening... (speak naturally)';

      const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
        ? 'audio/webm;codecs=opus'
        : MediaRecorder.isTypeSupported('audio/mp4')
        ? 'audio/mp4'
        : '';
      const recorder = mimeType ? new MediaRecorder(mediaStream, { mimeType }) : new MediaRecorder(mediaStream);
      mediaRecorder = recorder;
      const chunks = [];
      let spoke = false;
      let silenceStart = Date.now();
      const startedAt = Date.now();

      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      const source = audioContext.createMediaStreamSource(mediaStream);
      const analyser = audioContext.createAnalyser();
      analyser.fftSize = 512;
      source.connect(analyser);
      const dataArray = new Uint8Array(analyser.frequencyBinCount);

      clearInterval(vadInterval);
      vadInterval = setInterval(() => {
        if (!callActive || recorder.state !== 'recording') return;
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
        const avg = sum / dataArray.length;

        if (avg > 14) {
          spoke = true;
          silenceStart = Date.now();
          callStatus.textContent = '🎙️ Hearing you... (pause briefly when finished)';
        } else if (spoke && Date.now() - silenceStart > 1300) {
          clearInterval(vadInterval);
          if (recorder.state === 'recording') recorder.stop();
        } else if (!spoke && Date.now() - startedAt > 12000) {
          clearInterval(vadInterval);
          if (recorder.state === 'recording') recorder.stop();
        }
      }, 120);

      recorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) chunks.push(e.data);
      };

      recorder.onstop = async () => {
        clearInterval(vadInterval);
        if (!callActive) return;

        if (!spoke || chunks.length === 0) {
          if (callActive) listenOneUtterance();
          return;
        }

        isProcessingTurn = true;
        avatarRing.className = 'avatar-ring';
        callStatus.textContent = '⚡ Riz is thinking...';

        const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
        const reader = new FileReader();
        reader.onloadend = async () => {
          try {
            const base64 = String(reader.result || '').split(',')[1] || '';
            const res = await fetch('/api/voice/chat', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                audioBase64: base64,
                mimeType: (recorder.mimeType || 'audio/webm').split(';')[0],
                sender: 'Yazeed (Live Call)'
              })
            });
            const data = await res.json();
            if (data.transcript) addTranscript('you', data.transcript);
            if (data.reply) {
              addTranscript('riz', data.reply);
              await playBase64Audio(data.audioBase64, data.reply);
            }
          } catch (_) {}
          isProcessingTurn = false;
          if (callActive) listenOneUtterance();
        };
        reader.readAsDataURL(blob);
      };

      recorder.start();
    }

    startCallBtn.addEventListener('click', async () => {
      callActive = true;
      callSeconds = 0;
      startCallBtn.style.display = 'none';
      pushTurnBtn.style.display = 'inline-flex';
      endCallBtn.style.display = 'inline-flex';

      timerInterval = setInterval(() => {
        callSeconds++;
        callTimer.textContent = formatTime(callSeconds);
      }, 1000);

      await listenOneUtterance();
    });

    pushTurnBtn.addEventListener('click', () => {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
      }
    });

    endCallBtn.addEventListener('click', () => {
      callActive = false;
      clearInterval(timerInterval);
      clearInterval(vadInterval);
      if (currentAudio) currentAudio.pause();
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
      }
      if (mediaStream) {
        mediaStream.getTracks().forEach((t) => t.stop());
        mediaStream = null;
      }
      avatarRing.className = 'avatar-ring';
      callStatus.textContent = 'Call ended';
      startCallBtn.style.display = 'inline-flex';
      pushTurnBtn.style.display = 'none';
      endCallBtn.style.display = 'none';
    });
  </script>
</body>
</html>
